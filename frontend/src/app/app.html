<!-- Unauthenticated / Login View -->
<div *ngIf="!auth.isAuthenticated()" class="min-h-screen bg-canvas text-primary">
  <router-outlet></router-outlet>
</div>

<!-- Authenticated Operations Console Shell -->
<div *ngIf="auth.isAuthenticated()" class="app-shell flex h-screen w-screen overflow-hidden">
  <!-- Mobile Backdrop Overlay -->
  <div 
    *ngIf="isSidebarOpen()" 
    class="sidebar-backdrop fixed inset-0 z-30 bg-black/60 md:hidden"
    (click)="closeSidebar()"
  ></div>

  <!-- Primary Sidebar Nav -->
  <app-sidebar 
    [isOpen]="isSidebarOpen()" 
    (closeSidebar)="closeSidebar()"
  ></app-sidebar>

  <!-- Main Viewport Area -->
  <div class="main-viewport flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>
    <main class="content-body flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
